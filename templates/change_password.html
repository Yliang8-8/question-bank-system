{% extends "base.html" %}
{% block title %}账号设置 - 在线题库系统{% endblock %}
{% block content %}
<div class="page-heading compact">
  <div>
    <p class="eyebrow">ACCOUNT</p>
    <h1>账号设置</h1>
    <p class="muted">账号用于登录，用户名用于系统内显示。</p>
  </div>
  <a class="button secondary" href="{{ url_for('dashboard') }}">返回概览</a>
</div>
<form method="post" class="editor-form password-form">
  <label>登录账号
    <input value="{{ user.username }}" disabled>
  </label>
  <label>用户名
    <input name="display_name" value="{{ user.display_name or user.username }}" required minlength="2" maxlength="20">
  </label>
  <label>原密码
    <input name="old_password" type="password" autocomplete="current-password" placeholder="修改密码时填写">
  </label>
  <label>新密码
    <input name="new_password" type="password" minlength="6" autocomplete="new-password" placeholder="不修改密码可留空">
  </label>
  <label>确认新密码
    <input name="confirm_password" type="password" minlength="6" autocomplete="new-password" placeholder="不修改密码可留空">
  </label>
  <div class="form-actions">
    <a class="button secondary" href="{{ url_for('dashboard') }}">取消</a>
    <button class="button primary" type="submit">保存设置</button>
  </div>
</form>
{% endblock %}
